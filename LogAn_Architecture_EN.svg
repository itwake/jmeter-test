      <stop offset="0" stop-color="#F6FBFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5FDFD"/>
      <stop offset="1" stop-color="#EAFBFA"/>
    </linearGradient>
    <linearGradient id="blueChip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7EEFF"/>
      <stop offset="1" stop-color="#D1EAFB"/>
    </linearGradient>
    <linearGradient id="tealChip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D2F3F3"/>
      <stop offset="1" stop-color="#C4EEEE"/>
