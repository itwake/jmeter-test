<svg xmlns="http://www.w3.org/2000/svg" width="1648" height="928" viewBox="0 0 1648 928" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">LogAn — Simple Architecture</title>
  <desc id="diagram-description">Cases and logs flow through the web app into the API and analysis engine, which produces investigation views. Storage supports the engine. Optional AI is connected to the engine by a dashed arrow. Evidence-based, human-reviewed. All visible artwork is vector; all labels remain editable text.</desc>
